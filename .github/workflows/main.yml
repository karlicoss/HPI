# see https://github.com/karlicoss/pymplate for up-to-date reference

name: CI
on:
  push:
    # Deliberate: we want CI on pushed branches without having to open a PR.
    branches: '**'
    tags: 'v[0-9]+.*' # only trigger on 'release' tags for PyPi
    # Ideally I would put this in the pypi job... but github syntax doesn't allow for regexes there :shrug:

  # Needed to trigger on others' PRs.
  # Note that people who fork it need to go to "Actions" tab on their fork and click "I understand my workflows, go ahead and enable them".
  # NOTE: together with the push trigger above, same-repo branches with an open PR get double CI runs.
  # Keeping both anyway: push covers branches without a PR, this one is needed for fork PRs,
  # and the runs aren't identical -- pull_request checks the merge commit against the base branch, push checks the branch head.
  pull_request:

  # Needed to trigger workflows manually.
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

  schedule:
    - cron: '31 18 * * 5'  # run every Friday


permissions:
  contents: read  # repos created before 2023 have write permissions as default. Protects against compromised actions.


jobs:
  # GitHub disables scheduled workflows in public repositories after 60 days without repository activity:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
  # Calling enable on an active workflow prevents this timeout (a workaround not documented by GitHub).
  # See https://github.com/liskin/gh-workflow-keepalive
  keepalive:
    # Run independently of build so failing tests do not stop the keepalive.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
    - name: Keep scheduled (cron) workflows enabled during inactivity
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/enable"


  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - &minimum_python '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        exclude: [
            # windows runners are pretty scarce, so let's only run lowest and highest python version
            {platform: windows-latest, python-version: '3.13'},
            {platform: windows-latest, python-version: '3.14'},

            # same, macos is a bit too slow and ubuntu covers python quirks well
            {platform: macos-latest  , python-version: '3.13' },
            {platform: macos-latest  , python-version: '3.14' },
        ]

    runs-on: ${{ matrix.platform }}

    # useful for 'optional' pipelines
    # continue-on-error: ${{ matrix.platform == 'windows-latest' }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0  # nicer to have all git history when debugging/for tests

    # setup-uv doesn't publish floating major/minor tags, so use an exact full tag.
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false  # we don't have lock files during initial CI checkout, so can't use them as cache key

    - uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true  # restrict to the user who kicked off pipeline
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

    # Invoke Bash explicitly because Windows runners default to PowerShell.
    - run: bash .ci/run
      env:
        RUFF_OUTPUT_FORMAT: github

    - name: Check generated docs
      if: matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        bash .ci/run -e quarto -- --execute
        git diff --exit-code -- doc/


  pypi:
    # Do not run it for PRs/cron schedule etc.
    # NOTE: release tags are guarded by on: push: tags on the top.
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.master_branch)
    # Ugh, I tried using matrix or something to explicitly generate only test pypi or prod pypi pipelines.
    # But github actions is so shit, it's impossible to do any logic at all, e.g. doesn't support conditional matrix, if/else statements for variables etc.

    needs: [build] # add all other jobs here

    runs-on: ubuntu-latest

    permissions:
      contents: read   # necessary to repeat since 'permissions:' replace global ones, not augment
      id-token: write  # necessary for Trusted Publishing
    env:
      # always deploy merged master to test pypi
      # always deploy tags to release pypi
      TARGET:      ${{ github.ref_type == 'tag' && 'pypi'     || 'testpypi' }}
    environment:
      # for "deployments" tab on github
      # sadly can't reuse env.TARGET here...
      name:        ${{ github.ref_type == 'tag' && 'pypi'     || 'testpypi' }}
      url: https://${{ github.ref_type == 'tag' && 'pypi.org' || 'test.pypi.org' }}/project/${{ steps.meta.outputs.pypi_name }}/
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0  # pull all commits to correctly infer vcs version

    # setup-uv doesn't publish floating major/minor tags, so use an exact full tag.
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: *minimum_python
        enable-cache: false  # we don't have lock files during initial CI checkout, so can't use them as cache key

    - name: 'release to ${{ env.TARGET }}'
      run: .ci/release ${{ env.TARGET == 'testpypi' && '--use-test-pypi' || '' }}

    # NOTE: name/version are extracted from the built wheel -- build backend is the source of truth for name normalization.
    # So this has to run after the release step (which builds the wheel),
    # and the release step name above can't include the package name (step names render when the step starts).
    - id: meta
      name: 'release summary'
      shell: bash
      run: |
        metadata=$(unzip -p dist/*.whl '*.dist-info/METADATA')
        pypi_name=$(awk '/^Name:/    {print $2; exit}' <<< "$metadata")
        version=$(awk '/^Version:/  {print $2; exit}' <<< "$metadata")
        echo "pypi_name=$pypi_name" >> "$GITHUB_OUTPUT"
        host=$([ "$TARGET" = 'pypi' ] && echo 'pypi.org' || echo 'test.pypi.org')
        echo "released [$pypi_name $version](https://$host/project/$pypi_name/$version/) to $TARGET" >> "$GITHUB_STEP_SUMMARY"
